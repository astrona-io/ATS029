# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats029-010
course_id: ATS029
exam_code: CKAD
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Discover and use resources that extend Kubernetes (CRD, Operators)"
questions:
  - id: ats029-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish registering a custom type from implementing its behavior"
    source_readings:
      - sections/section-010/module-01/course-01-custom-resources-and-operators.md
    prompt: |-
      A team applies a CustomResourceDefinition for the kind `Cache` and then creates a `Cache` object. The API server accepts the object and `kubectl get caches` lists it, but no pods ever appear. What is the most likely reason?
    options:
      - id: a
        text: "The API server only stores custom resources after an administrator approves them."
        explanation: "The API server stores a valid custom resource immediately. The object is already listed, which shows that it was stored."
      - id: b
        text: "The CustomResourceDefinition only registers the type. No controller is running that watches `Cache` objects and creates pods for them."
        explanation: "Correct. Registering a type gives the API server a place to store and validate the objects. Behavior comes from a controller, which is the part of an operator that watches the objects and creates the workload."
      - id: c
        text: "Custom resources can only create pods when they are in the `kube-system` namespace."
        explanation: "No such rule exists. A custom resource creates nothing by itself in any namespace."
      - id: d
        text: "The `Cache` object needs a `spec.replicas` field, because without it the scheduler ignores the object."
        explanation: "The scheduler places pods and never reads custom resources."
    correct_option: b
    explanation: "A CustomResourceDefinition registers the type and nothing more. A controller must watch the objects and create the pods, and none is running."

  - id: ats029-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Interpret the desired fields and the controller observations of a custom resource"
    source_readings:
      - sections/section-010/module-01/course-02-reading-a-custom-resource-and-its-controller-contract.md
    prompt: |-
      You read a custom resource and want to know what the controller has observed and done, not what the user asked for. Which part of the object do you read?
    options:
      - id: a
        text: "The `spec`, because it is updated by the controller after each change."
        explanation: "The `spec` holds the desired state that the user writes. The controller does not rewrite it."
      - id: b
        text: "The `metadata.labels`, because controllers store their results in labels."
        explanation: "Labels are for selection and grouping. Observed state is not stored there by convention."
      - id: c
        text: "The `metadata.name`, because the controller renames the object when it is ready."
        explanation: "The name of an object cannot change."
      - id: d
        text: "The `status`, which the controller writes to report what it observed, such as ready replicas and conditions."
        explanation: "Correct. The `spec` is the desired state written by the user, and the `status` is the observed state written by the controller."
    correct_option: d
    explanation: "The `spec` is the desired state written by the user. The `status` is written by the controller and reports what it observed."

  - id: ats029-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Write the metadata and spec fields that every CustomResourceDefinition needs"
    source_readings:
      - sections/section-010/module-02/course-01-writing-a-crd.md
    prompt: |-
      You register the kind `Dock` in the API group `fleet.astrona.io` with the plural name `docks`. Which value must `metadata.name` of the CustomResourceDefinition have?
    options:
      - id: a
        text: "`docks.fleet.astrona.io`, the plural name and the group joined by a dot."
        explanation: "Correct. The API server requires the name to be `<plural>.<group>`, and it rejects any other value."
      - id: b
        text: "`dock`, the kind in lowercase."
        explanation: "The name must include the plural and the group. A bare kind name is rejected."
      - id: c
        text: "`fleet.astrona.io.docks`, the group followed by the plural name."
        explanation: "The order is reversed. The plural name comes first."
      - id: d
        text: "Any name, because the fields `group` and `names` in the spec define the type."
        explanation: "The spec defines the type, but the API server still checks that the object name equals `<plural>.<group>`."
    correct_option: a
    explanation: "The name of a CustomResourceDefinition must be the plural name and the group joined by a dot, here `docks.fleet.astrona.io`."

  - id: ats029-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Discover the custom types in a cluster and read their schema with kubectl"
    source_readings:
      - sections/section-010/module-03/course-01-discovering-custom-types-and-operators.md
    prompt: |-
      You join a cluster and need to find which custom types exist and what the fields of one of them mean. Which pair of commands does this?
    options:
      - id: a
        text: "`kubectl get pods -A` to list the types, and `kubectl logs` to read the fields."
        explanation: "Pods are not types, and logs do not describe an API schema."
      - id: b
        text: "`kubectl get namespaces` to list the types, and `kubectl top` to read the fields."
        explanation: "Namespaces are objects, and `kubectl top` shows resource usage."
      - id: c
        text: "`kubectl get crd` to list the registered custom types, and `kubectl explain <plural>.spec` to read the documented fields."
        explanation: "Correct. Each CustomResourceDefinition is one registered type, and `kubectl explain` reads the schema that the CustomResourceDefinition publishes."
      - id: d
        text: "`kubectl describe node` to list the types, and `kubectl cluster-info` to read the fields."
        explanation: "Nodes and the cluster endpoint information do not list API types."
    correct_option: c
    explanation: "`kubectl get crd` lists the custom types, and `kubectl explain` reads the schema of one type."

  - id: ats029-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a structural schema does with a field it does not declare"
    source_readings:
      - sections/section-010/module-02/course-02-validation-defaults-and-status.md
    prompt: |-
      A CustomResourceDefinition has a structural schema that lists `spec.source` and does not set `x-kubernetes-preserve-unknown-fields`. A user applies an object with `spec.colour: red` and switches strict field validation off with `--validate=false`. What does the API server store?
    options:
      - id: a
        text: "The object with `spec.colour: red`, because the API server never changes data from clients."
        explanation: "With a structural schema the API server removes fields that the schema does not declare."
      - id: b
        text: "Nothing. The request fails with an error for every unknown field, even without strict validation."
        explanation: "Rejection is what strict validation does. Without it the server does not reject unknown fields."
      - id: c
        text: "The object with `spec.colour` moved to the annotations."
        explanation: "The API server does not move fields anywhere."
      - id: d
        text: "The object without `spec.colour`. The server prunes the undeclared field silently."
        explanation: "Correct. Pruning drops fields that the schema does not declare, and without strict validation there is no error."
    correct_option: d
    explanation: "Without strict validation the server prunes fields that the schema does not declare and stores the rest."

  - id: ats029-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how the status subresource separates desired state from observed state"
    source_readings:
      - sections/section-010/module-02/course-02-validation-defaults-and-status.md
    prompt: |-
      A CustomResourceDefinition enables the status subresource. A user runs `kubectl apply` with a manifest that contains `status.phase: Running`. What happens to the `status` part of the manifest?
    options:
      - id: a
        text: "It is stored, because `kubectl apply` writes the whole object."
        explanation: "With the status subresource, a write to the main resource ignores changes to `status`."
      - id: b
        text: "It is ignored. Only a request to the `/status` endpoint changes `status`, and a request to the main endpoint changes the rest."
        explanation: "Correct. The subresource splits the object into two write paths, so a user edit of the `spec` cannot overwrite what the controller reported."
      - id: c
        text: "It makes the request fail with a forbidden error for every user."
        explanation: "The request succeeds. The `status` part is ignored without an error."
      - id: d
        text: "It is stored, and it also raises `metadata.generation`."
        explanation: "A change to `status` never raises `metadata.generation`."
    correct_option: b
    explanation: "With the status subresource enabled, `status` changes only through the `/status` endpoint, and writes to the main endpoint ignore it."

  - id: ats029-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "State the effect of deleting a CustomResourceDefinition"
    source_readings:
      - sections/section-010/module-02/course-03-versions-and-removing-a-crd.md
    prompt: |-
      An administrator runs `kubectl delete crd gates.fleet.astrona.io` while 40 `Gate` objects exist in several namespaces. What happens?
    options:
      - id: a
        text: "The type is removed and the API server also deletes all 40 `Gate` objects."
        explanation: "Correct. Deleting the definition deletes every custom resource of that type, in every namespace."
      - id: b
        text: "The type is removed, and the 40 objects stay in storage and return when the CustomResourceDefinition is created again."
        explanation: "The objects are deleted together with the definition."
      - id: c
        text: "The request is refused until all `Gate` objects are deleted first."
        explanation: "Kubernetes does not require that. The delete succeeds and removes the objects."
      - id: d
        text: "Only the objects in the `default` namespace are deleted."
        explanation: "The deletion covers every namespace."
    correct_option: a
    explanation: "Deleting a CustomResourceDefinition deletes all custom resources of that type in all namespaces."

  - id: ats029-010-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain served versions and the storage version of a CustomResourceDefinition"
    source_readings:
      - sections/section-010/module-02/course-03-versions-and-removing-a-crd.md
    prompt: |-
      A CustomResourceDefinition lists the versions `v1` and `v2`. Both are served. How many versions may have `storage: true`?
    options:
      - id: a
        text: "None. The API server chooses the storage version on its own."
        explanation: "The definition must name the storage version. The API server rejects a definition without one."
      - id: b
        text: "Both, so that every client reads the format that it asked for without a conversion."
        explanation: "More than one storage version is rejected."
      - id: c
        text: "Exactly one. The objects are persisted in that version, and the API server serves the other versions from it."
        explanation: "Correct. One version is the storage version, and every served version is available to clients."
      - id: d
        text: "One for each served version, but only if a conversion webhook is configured."
        explanation: "A webhook does not change the rule. There is still exactly one storage version."
    correct_option: c
    explanation: "Exactly one version has `storage: true`. All served versions are read from that stored form."

  - id: ats029-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Interpret generation and observed generation in the status of a custom resource"
    source_readings:
      - sections/section-010/module-03/course-02-creating-a-custom-resource-and-reading-status.md
    prompt: |-
      You scale a `Hangar` by changing `spec.replicas` and read the object right after. The condition `Ready` is `True`, `metadata.generation` is 3 and `status.observedGeneration` is 2. What does this mean?
    options:
      - id: a
        text: "The operator is healthy and has processed your change."
        explanation: "The observed generation is lower than the generation, so your latest change is not processed yet."
      - id: b
        text: "The operator has not processed the latest change yet. The condition `Ready` describes the previous spec."
        explanation: "Correct. `observedGeneration` is the generation that the operator last processed. When it is lower than `metadata.generation`, the status is about an older spec."
      - id: c
        text: "The CustomResourceDefinition has two versions and the object is stored in the older one."
        explanation: "Generation counts changes to `spec`. It has nothing to do with API versions."
      - id: d
        text: "Someone edited the status by hand, and the number 2 is the count of edits."
        explanation: "Changes to `status` never raise the generation, and the field is not an edit counter."
    correct_option: b
    explanation: "An `observedGeneration` below `metadata.generation` means that the status describes an older spec."

  - id: ats029-010-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain owner references and the effect of the cascade option on dependents"
    source_readings:
      - sections/section-010/module-03/course-03-ownership-and-finalizers.md
    prompt: |-
      An operator created the Deployment `hangar-probe-bay` with an owner reference to the `Hangar` `probe-bay`. You run `kubectl delete hangar probe-bay --cascade=orphan`. What happens to the Deployment?
    options:
      - id: a
        text: "It is deleted by the garbage collector, as it is with the default option."
        explanation: "The default option deletes the dependents. The option `orphan` does not."
      - id: b
        text: "It is deleted first, and the `Hangar` is deleted after it."
        explanation: "That order describes the option `foreground`."
      - id: c
        text: "The delete request is refused, because an owned object exists."
        explanation: "An owner can be deleted while it has dependents."
      - id: d
        text: "It stays, and the owner reference is removed from it, so nothing deletes it later."
        explanation: "Correct. The option `orphan` deletes only the owner and removes the owner references from the dependents."
    correct_option: d
    explanation: "With `--cascade=orphan` only the owner is deleted. The dependents stay and lose their owner reference."

  - id: ats029-010-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why an object with a finalizer stays after it is deleted"
    source_readings:
      - sections/section-010/module-03/course-03-ownership-and-finalizers.md
    prompt: |-
      You delete a `Hangar`. `kubectl get hangars` still lists it, and its `metadata.deletionTimestamp` is set. The `metadata.finalizers` list holds one entry. What is the cause and the correct reaction?
    options:
      - id: a
        text: "A finalizer blocks removal until the controller that owns it removes its entry. Find that controller first. If none exists, clear the list with `kubectl patch`."
        explanation: "Correct. The API server removes the object only when the finalizers list is empty. Clearing the list by hand skips the cleanup that the controller should do, so check the controller first."
      - id: b
        text: "The delete request failed. Run the delete command again until the object is gone."
        explanation: "The request succeeded, which is why the deletion timestamp is set."
      - id: c
        text: "The garbage collector is slow. Wait ten minutes and the object disappears."
        explanation: "Waiting does not help. The finalizer entry stays until something removes it."
      - id: d
        text: "Delete the CustomResourceDefinition, which removes the finalizer from every object."
        explanation: "That deletes every object of the type and is not a targeted fix."
    correct_option: a
    explanation: "A finalizer holds the object until its owner removes the entry. If no controller will do it, clear the list with a patch."

  - id: ats029-010-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a custom resource that does not reconcile because the operator lacks a permission"
    source_readings:
      - sections/section-010/module-03/course-04-troubleshooting-a-resource-that-does-not-reconcile.md
    prompt: |-
      A `Hangar` never becomes ready. The operator pod runs. Its log shows a `403` error for the request to create a Deployment, and `kubectl auth can-i create deployments.apps -n starfleet --as=system:serviceaccount:fleet-system:hangar-operator` prints `no`. What is the correct fix?
    options:
      - id: a
        text: "Bind the operator service account to `cluster-admin`."
        explanation: "This works but grants far more than the operator needs."
      - id: b
        text: "Delete and create the `Hangar` again so that the operator retries with a new uid."
        explanation: "A new object does not change the permissions of the service account."
      - id: c
        text: "Add the verb `create` for `deployments` in the group `apps` to the `ClusterRole` that the operator uses."
        explanation: "Correct. The error shows exactly which permission is missing, and adding only that verb keeps the operator at least privilege."
      - id: d
        text: "Restart the CustomResourceDefinition by deleting it."
        explanation: "The CustomResourceDefinition is not the cause, and deleting it deletes every custom resource."
    correct_option: c
    explanation: "A `403` and a `no` from `kubectl auth can-i` show a missing permission. Add only the missing verb to the role."
