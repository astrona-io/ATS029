# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# CRDs And Operators Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - ghcr.io/stefanprodan/podinfo:6.15.0

# Starting state: a Hangar CRD without status subresource, status schema,
# replica limits or printer columns, the hangar-operator whose ClusterRole lacks
# the `create` verb on deployments, a Hangar `scout-bay` that cannot reconcile,
# and a Hangar `old-bay` that is deleted but held by a finalizer.
# The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Install the defective Hangar CRD and the faulty operator, then create the two Hangars
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: crd-schema-and-status
      description: The CRD enables the status subresource, declares the status fields and limits replicas to 1 to 5
      type: file
      source: validation/validate-crd-schema.sh
      hint: Edit the CRD in place. Version v1 needs subresources.status, a status schema with observedGeneration, readyReplicas and conditions, and minimum 1 and maximum 5 on spec.replicas. Test the limits with kubectl apply --dry-run=server.
    - name: printer-columns
      description: kubectl get hangars shows the columns Replicas and Ready
      type: file
      source: validation/validate-printer-columns.sh
      hint: Add additionalPrinterColumns to version v1. The Ready column needs a jsonPath that selects the condition with the type Ready, for example .status.conditions[?(@.type=="Ready")].status.
    - name: operator-permission-least-privilege
      description: The operator may create and patch Deployments and has no extra rights
      type: file
      source: validation/validate-operator-permission.sh
      hint: Read the operator log, then add only the missing verb on deployments in the apps group to the hangar-operator ClusterRole. Do not bind cluster-admin, admin or edit and do not use a wildcard.
    - name: scout-bay-ready-and-owned
      description: scout-bay is Ready for its current generation and owns the Deployment hangar-scout-bay
      type: file
      source: validation/validate-scout-bay-ready.sh
      hint: After the CRD and the permission are fixed the operator creates the Deployment and writes the status by itself. Wait for it. Do not delete and recreate scout-bay and do not create the Deployment by hand.
    - name: old-bay-removed
      description: old-bay is gone and the CRD is untouched
      type: file
      source: validation/validate-old-bay-removed.sh
      hint: old-bay has a finalizer that nothing removes. Check metadata.deletionTimestamp and metadata.finalizers, then clear the list with kubectl patch. Do not delete the CRD.
    - name: operator-reconciles-new-hangars
      description: A new Hangar gets an owned Deployment, a scale change and a status update, and deletion cleans up
      type: file
      source: validation/validate-reconcile-and-cleanup.sh
      hint: Create a Hangar, wait for the Deployment, scale it with a patch of the Hangar, and delete the Hangar. The status must follow the generation, which needs the status subresource.

teardown:
  keepCluster: false
