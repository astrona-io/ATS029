# Reference CRD for the playground: a complete definition to read and explain.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: telemetries.fleet.astrona.io
spec:
  group: fleet.astrona.io
  scope: Namespaced
  names:
    plural: telemetries
    singular: telemetry
    kind: Telemetry
    listKind: TelemetryList
    shortNames:
    - tlm
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Source
      type: string
      jsonPath: .spec.source
      description: The vehicle that sends the readings
    - name: Interval
      type: integer
      jsonPath: .spec.intervalSeconds
    - name: Level
      type: string
      jsonPath: .spec.level
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        description: Telemetry describes one stream of readings from a vehicle.
        properties:
          spec:
            type: object
            description: The desired stream.
            required:
            - source
            properties:
              source:
                type: string
                description: Name of the vehicle that sends the readings.
              intervalSeconds:
                type: integer
                minimum: 1
                maximum: 3600
                default: 60
                description: Seconds between two readings.
              level:
                type: string
                enum:
                - info
                - warning
                - critical
                default: info
                description: Lowest severity that is kept.
          status:
            type: object
            description: Written by a controller. The playground has none.
            properties:
              phase:
                type: string
