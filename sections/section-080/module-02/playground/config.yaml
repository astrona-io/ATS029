# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Users, Groups, Capabilities And Privilege (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies two workloads that have no securityContext,
# then stays running for free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-playground-080-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - docker.io/library/busybox:1.37.0

# What the learner starts with: the `scout` (podinfo) and `shuttle` (busybox)
# Deployments in `starfleet`, both with no securityContext.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
