# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Deployment Rejected By Pod Security Admission (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-lab-080-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: `outpost` enforces the restricted level and the `bridge`
# Deployment breaks it (host network, hostPath, no securityContext), so it
# has no pod.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the restricted namespace and the rejected bridge Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: namespace-policy-intact
      description: outpost still enforces the restricted level
      type: file
      source: validation/validate-namespace-policy-intact.sh
      hint: Do not change the labels of outpost. Fix the pod template of the Deployment instead.
    - name: bridge-available
      description: The bridge Deployment has one available replica and its original container
      type: file
      source: validation/validate-bridge-available.sh
      hint: Read the FailedCreate events of the ReplicaSet, fix the template and wait for the rollout. Keep the image, the container name and the command.
    - name: no-host-access
      description: No host namespace and no hostPath volume
      type: file
      source: validation/validate-no-host-access.sh
      hint: Remove hostNetwork and replace the hostPath volume work with an emptyDir volume of the same name.
    - name: hardening
      description: bridge runs as user 1000 with a seccomp filter and no capability
      type: file
      source: validation/validate-hardening.sh
      hint: Set runAsNonRoot, runAsUser 1000 and seccompProfile RuntimeDefault, and drop ALL capabilities with allowPrivilegeEscalation false in the container.
    - name: writable-paths
      description: The root filesystem is read-only and /tmp and /work are writable volumes
      type: file
      source: validation/validate-writable-paths.sh
      hint: Keep readOnlyRootFilesystem true and mount an emptyDir at /tmp and one at /work.

teardown:
  keepCluster: false
