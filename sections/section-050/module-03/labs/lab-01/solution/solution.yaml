apiVersion: v1
kind: LimitRange
metadata:
  name: outpost-defaults
  namespace: outpost
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
        ephemeral-storage: 200Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 50Mi
      max:
        cpu: 500m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: outpost-quota
  namespace: outpost
spec:
  hard:
    pods: "6"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    requests.ephemeral-storage: 1Gi
    limits.ephemeral-storage: 2Gi
