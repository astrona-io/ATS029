# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Apply Namespace Defaults And Quota (LAB). Graded against the live cluster.
# UNTESTED: authored with static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-lab-050-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - busybox:1.37.0

# Starting state: outpost has a ResourceQuota and no LimitRange. drifter has no
# resources, so its Pods are refused. beacon has a CPU limit of 2 that a
# LimitRange maximum would reject. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespace, the quota and the two Deployments
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: limitrange-defaults
      description: The LimitRange outpost-defaults has the required defaults and maximums
      type: file
      source: validation/validate-limitrange-defaults.sh
      hint: Create a LimitRange named outpost-defaults in outpost with a Container rule. Set default, defaultRequest and max exactly as the task lists, including ephemeral-storage defaults.
    - name: drifter-uses-defaults
      description: drifter runs with the values added by the LimitRange
      type: file
      source: validation/validate-drifter-uses-defaults.sh
      hint: Do not write resources into the drifter Deployment. Once the LimitRange exists, restart the Deployment so the ReplicaSet creates Pods again.
    - name: beacon-within-maximum
      description: beacon is Running with limits inside the LimitRange maximum
      type: file
      source: validation/validate-beacon-within-maximum.sh
      hint: The beacon CPU limit of 2 is above the maximum of 500m. Lower it, and keep the memory limit at or below 256Mi.
    - name: quota-tracks-ephemeral-storage
      description: The quota also caps ephemeral storage and keeps its other values
      type: file
      source: validation/validate-quota-tracks-ephemeral-storage.sh
      hint: Add requests.ephemeral-storage 1Gi and limits.ephemeral-storage 2Gi to spec.hard of outpost-quota. Do not delete the quota or change its other values.
    - name: pods-carry-ephemeral-requests
      description: Every Pod in outpost states ephemeral storage requests and limits
      type: file
      source: validation/validate-pods-carry-ephemeral-requests.sh
      hint: The LimitRange defaults add ephemeral storage to Pods created after it exists. An older beacon Pod must be replaced by a rollout.

teardown:
  keepCluster: false
