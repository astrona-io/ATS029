apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
# shuttle: needs about 100 MiB at its peak, limit is 32Mi, so it is OOMKilled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: busybox:1.37.0
          command: ["sh", "-c", "head -c 40000000 /dev/zero | tail > /dev/null; sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
# scout: Burstable because requests differ from limits and the init container
# and the sidecar have no limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      initContainers:
        - name: prepare
          image: busybox:1.37.0
          command: ["sh", "-c", "echo ready"]
        - name: metrics-agent
          image: busybox:1.37.0
          restartPolicy: Always
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
# probe: the CPU value 100 means one hundred cores, so the Pod stays Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "100"
              memory: 64Mi
            limits:
              cpu: "100"
              memory: 128Mi
