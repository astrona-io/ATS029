# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Requests, Limits And Quotas Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-capstone-030
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - docker.io/library/python:3.13-alpine

# Starting state: namespace starfleet with probe (three replicas, no resources),
# bridge (killed for exceeding its memory limit), no LimitRange and no quota.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starfleet workloads with no LimitRange and no quota
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: limitrange-values
      description: starfleet-limits has the requested Container values
      type: file
      source: validation/validate-limitrange-values.sh
      hint: Create the LimitRange starfleet-limits in starfleet with one Container entry and the default, defaultRequest, min and max values from the task.
    - name: quota-values
      description: starfleet-budget has the requested hard limits
      type: file
      source: validation/validate-quota-values.sh
      hint: Create the ResourceQuota starfleet-budget with requests.cpu, requests.memory, limits.cpu, limits.memory and pods exactly as in the task.
    - name: probe-gets-defaults
      description: probe runs three replicas that carry the LimitRange defaults
      type: file
      source: validation/validate-probe-defaults.sh
      hint: Create the LimitRange first, then restart probe so new pods are admitted with defaults. Do not write resources into the Deployment.
    - name: bridge-guaranteed-and-stable
      description: bridge is Guaranteed, running and no longer killed
      type: file
      source: validation/validate-bridge-guaranteed.sh
      hint: bridge needs more memory than 128Mi. Set requests equal to limits for CPU and memory and stay inside the LimitRange and the quota.
    - name: budget-enforced
      description: The quota and the maximum still refuse oversized pods
      type: file
      source: validation/validate-budget-enforced.sh
      hint: Do not delete the quota or the LimitRange and do not raise the maximum. A pod requesting 512Mi must be refused by the quota and a pod with a 1Gi limit by the maximum.

teardown:
  keepCluster: false
