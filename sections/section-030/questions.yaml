questions:
- id: ats029-section-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish resource requests from usage and limits.
  source_readings:
  - sections/section-030/module-01/course-01-requests-limits-and-namespace-budgets.md
  prompt: A container uses little CPU now but declares a large request. What does scheduling normally
    consider for allocation?
  options:
  - id: a
    text: The declared request with applicable placement rules
    explanation: Current usage is not a substitute for declared scheduling needs.
  - id: b
    text: Only the instantaneous sample
    explanation: Scheduling does not universally replace requests with measured usage.
  - id: c
    text: Only its Service type
    explanation: Service exposure is independent of resource allocation.
  correct_option: a
  explanation: Current usage is not a substitute for declared scheduling needs.
- id: ats029-section-030-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain CPU and memory enforcement differences.
  source_readings:
  - sections/section-030/module-01/course-01-requests-limits-and-namespace-budgets.md
  prompt: How can CPU and memory limit failures differ?
  options:
  - id: a
    text: Both always produce the same retry event
    explanation: The effects and observations need separate interpretation.
  - id: b
    text: Both automatically increase node capacity
    explanation: Limits constrain use rather than add infrastructure.
  - id: c
    text: CPU can be throttled while exceeding memory allowance can cause termination
    explanation: Their runtime enforcement mechanisms are different.
  correct_option: c
  explanation: Their runtime enforcement mechanisms are different.
- id: ats029-section-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Identify defaults and quota admission effects.
  source_readings:
  - sections/section-030/module-01/course-01-requests-limits-and-namespace-budgets.md
  prompt: A LimitRange supplies omitted resource settings. What should authors review?
  options:
  - id: a
    text: Only the title of the course
    explanation: Author-facing titles do not determine admission defaults.
  - id: b
    text: The effective admitted workload rather than only omitted source fields
    explanation: Defaults can change the configuration actually used.
  - id: c
    text: An assumption that omitted requests must remain absent
    explanation: Namespace admission can provide defaults.
  correct_option: b
  explanation: Defaults can change the configuration actually used.
- id: ats029-section-030-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Diagnose allocation policy separately from placement.
  source_readings:
  - sections/section-030/module-01/course-01-requests-limits-and-namespace-budgets.md
  prompt: A request is rejected by quota before a Pod is accepted. Which distinction matters?
  options:
  - id: a
    text: Admission policy rejection versus scheduling of an existing Pod
    explanation: There is no accepted Pod yet for the scheduler to place.
  - id: b
    text: A running application's readiness failure
    explanation: The request failed at a different stage.
  - id: c
    text: A guaranteed registry outage
    explanation: Quota denial does not establish missing image access.
  correct_option: a
  explanation: There is no accepted Pod yet for the scheduler to place.
- id: ats029-section-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish resource requests from usage and limits.
  source_readings:
  - sections/section-030/module-01/course-01-requests-limits-and-namespace-budgets.md
  prompt: Why include a helper container in resource review?
  options:
  - id: a
    text: Helpers never consume allocated resources
    explanation: A supporting role does not remove resource use.
  - id: b
    text: Only containers with public ports count
    explanation: Capacity accounting is not limited to externally serving containers.
  - id: c
    text: It contributes to the workload's effective capacity needs
    explanation: The complete workload must be accounted for.
  correct_option: c
  explanation: The complete workload must be accounted for.
