# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Set Namespace Defaults And Fix An OOM-Killed Workload (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-lab-030-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - docker.io/library/python:3.13-alpine

# Starting state: drifter with no resources, beacon killed for exceeding its
# memory limit, and no LimitRange in outpost.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the outpost workloads with no LimitRange
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: limitrange-values
      description: outpost-limits has the requested Container values
      type: file
      source: validation/validate-limitrange-values.sh
      hint: Create the LimitRange outpost-limits in outpost with one Container entry. Set default, defaultRequest, min, max and a CPU maxLimitRequestRatio of 4 exactly as in the task.
    - name: drifter-gets-defaults
      description: drifter pods carry the LimitRange defaults, not values from the Deployment
      type: file
      source: validation/validate-drifter-defaults.sh
      hint: Restart the drifter Deployment so a new pod is admitted after the LimitRange exists. Do not write resources into the Deployment.
    - name: beacon-guaranteed-and-stable
      description: beacon is Guaranteed, running and no longer killed
      type: file
      source: validation/validate-beacon-guaranteed.sh
      hint: beacon needs more memory than 128Mi. Set requests equal to limits for CPU and memory (for example 200m and 256Mi) so the class is Guaranteed, and stay below the LimitRange maximum.
    - name: limits-enforced
      description: Pods above the maximum or the ratio are rejected and defaults are applied
      type: file
      source: validation/validate-limits-enforced.sh
      hint: Do not raise the maximum or delete the LimitRange. A pod with a 1Gi memory limit must be refused, and a pod with no resources must receive the defaults.

teardown:
  keepCluster: false
