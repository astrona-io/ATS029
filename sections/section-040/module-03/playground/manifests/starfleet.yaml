# Starting state for the "Consuming ConfigMaps" playground: the starfleet
# namespace, the scout-settings ConfigMap and a viewer Deployment with one
# busybox pod for `kubectl exec`.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-settings
  namespace: starfleet
data:
  LOG_LEVEL: info
  REGION: outpost-7
  app.properties: |
    retries=3
    region=outpost-7
  banner.txt: |
    scout online
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewer
  namespace: starfleet
  labels:
    app: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viewer
  template:
    metadata:
      labels:
        app: viewer
    spec:
      containers:
        - name: viewer
          image: docker.io/library/busybox:1.37.0
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
