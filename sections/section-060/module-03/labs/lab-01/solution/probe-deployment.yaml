apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      terminationGracePeriodSeconds: 1
      containers:
        - name: probe
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: probe-credentials
                  key: password
          volumeMounts:
            - name: certificate
              mountPath: /etc/probe/tls
              readOnly: true
      volumes:
        - name: certificate
          secret:
            secretName: probe-certificate
            defaultMode: 0400
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: probe-credentials-reader
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["probe-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-reads-probe-credentials
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: auditor
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: probe-credentials-reader
