# Starting state for the lab: the scout Deployment reads its API key from a
# Secret named scout-credentials that does not exist yet, so its pod cannot
# start.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: scout
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scout-credentials
                  key: api-key
