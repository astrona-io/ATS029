# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Create Secrets With kubectl And YAML (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies two namespaces, two workloads and one
# existing Secret, then stays running for free exploration. No task, no
# grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-playground-060-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - busybox:1.37.0
      - curlimages/curl:8.22.0

# What the learner starts with: `starfleet` with the scout Deployment and the
# scout-legacy Secret, and `outpost` with the drifter Deployment.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
