# Starting state for the capstone: the bridge Deployment holds an old password
# as a plain value, the Secret bridge-credentials holds the same old password,
# there is no registry Secret, and the auditor service account has no
# permissions.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bridge
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: bridge-credentials
  namespace: starfleet
type: Opaque
stringData:
  username: bridge-operator
  password: Old-1000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
  labels:
    app: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      serviceAccountName: bridge
      terminationGracePeriodSeconds: 1
      containers:
        - name: bridge
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: BRIDGE_PASSWORD
              value: Old-1000
