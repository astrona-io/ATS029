# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Create & Consume Secrets Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-capstone-060
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - busybox:1.37.0
      - curlimages/curl:8.22.0

# Starting state: bridge-credentials holds an old password, the bridge
# Deployment holds the same password as a plain value and has no pull Secret,
# and the auditor service account has no permissions.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the Secret, the service accounts and the bridge Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: secrets-created-and-rotated
      description: bridge-credentials has the rotated password and bridge-registry has the right login
      type: file
      source: validation/validate-secrets-created-and-rotated.sh
      hint: Patch only the password key with stringData so the username stays. Create bridge-registry with kubectl create secret docker-registry.
    - name: bridge-env-from-secret
      description: BRIDGE_PASSWORD comes from bridge-credentials and the container has the rotated value
      type: file
      source: validation/validate-bridge-env-from-secret.sh
      hint: Use secretKeyRef, remove the plain value, and make sure the pods restarted after the rotation so the environment holds the new password.
    - name: bridge-credentials-volume
      description: Only the password key is mounted read-only with mode 0400
      type: file
      source: validation/validate-bridge-credentials-volume.sh
      hint: Use a secret volume with items listing only password, defaultMode 0400 and a readOnly volumeMount at /etc/bridge/credentials.
    - name: bridge-pull-secret
      description: The bridge pods reference bridge-registry in imagePullSecrets
      type: file
      source: validation/validate-bridge-pull-secret.sh
      hint: Add imagePullSecrets with bridge-registry to the pod template, or to the bridge service account and restart the pods.
    - name: auditor-least-privilege
      description: auditor can get only the Secret bridge-credentials
      type: file
      source: validation/validate-auditor-least-privilege.sh
      hint: Use a Role with resourceNames [bridge-credentials] and the verb get only, bound to the auditor service account in starfleet.

teardown:
  keepCluster: false
