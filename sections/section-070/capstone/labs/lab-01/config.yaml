# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# ServiceAccounts Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-029-capstone-070
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state: bridge and scout run as the default service account, and a
# ClusterRoleBinding gives cluster-admin to that account. The faults are left
# in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty access setup
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: default-account-unprivileged
      description: The default account in starfleet has no extra permissions
      type: file
      source: validation/validate-default-unprivileged.sh
      hint: Find the ClusterRoleBinding that names the default account in starfleet and delete it. Do not widen the default account in another way.
    - name: bridge-lists-pods
      description: A request from the bridge pod lists pods in starfleet with HTTP 200
      type: file
      source: validation/validate-bridge-lists-pods.sh
      hint: Create the service account bridge, a Role with get, list and watch on pods, a RoleBinding to starfleet:bridge, and point the Deployment at the account.
    - name: bridge-least-privilege
      description: bridge cannot read Secrets, change pods or leave starfleet
      type: file
      source: validation/validate-bridge-least-privilege.sh
      hint: Use a Role and a RoleBinding in starfleet with the three read verbs on pods only. No wildcards, no ClusterRoleBinding.
    - name: bridge-pull-secret
      description: The bridge account carries regcred and bridge pods received it
      type: file
      source: validation/validate-bridge-pull-secret.sh
      hint: Put imagePullSecrets with regcred on the bridge account before the Deployment rolls, or roll it again.
    - name: scout-without-token
      description: scout runs as its own account with no token volume
      type: file
      source: validation/validate-scout-no-token.sh
      hint: Create the service account scout with automountServiceAccountToken false, point the Deployment at it and wait for the rollout.
    - name: scout-still-serves
      description: bridge reaches scout over HTTP
      type: file
      source: validation/validate-scout-serves.sh
      hint: Check that the new scout pod is Running and Ready.

teardown:
  keepCluster: false
