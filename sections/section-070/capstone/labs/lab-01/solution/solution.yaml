# Reference solution: the two accounts, the Role and the RoleBinding. The
# ClusterRoleBinding is deleted and the Deployments are pointed at the
# accounts in apply.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bridge
  namespace: starfleet
imagePullSecrets:
  - name: regcred
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bridge-pod-reader
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: bridge
    namespace: starfleet
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
