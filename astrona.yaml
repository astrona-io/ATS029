training:
  id: ATS029
  title: 'CKAD: Application Environment, Configuration and Security'
  description: Detailed CKAD teaching with module playgrounds, guided hands-on practice
    and reusable YAML knowledge checks. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Application Developer
    code: CKAD
    provider: CNCF / Linux Foundation
    domain: Application Environment, Configuration and Security
    weight: 25
    competencies:
    - Discover and use resources that extend Kubernetes (CRD, Operators)
    - Understand authentication, authorization and admission control
    - Understand requests, limits, quotas
    - Understand ConfigMaps
    - Define resource requirements
    - Create & consume Secrets
    - Understand ServiceAccounts
    - Understand Application Security (SecurityContexts, Capabilities, etc.)
